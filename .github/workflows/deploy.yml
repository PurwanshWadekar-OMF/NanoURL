name: NanoUrl

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
   
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '23'
    
    - name: Build Jar
      run : mvn clean package -DskipsTests

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build Docker Image
      run : docker build -t ${{secrets.DOCKERHUB_USERNAME}}/url-shortener-sb:latest
    
    - name: Push Image to Docker hub
      run : docker push ${{secrets.DOCKERHUB_USERNAME}}/url-shortener-sb:latest
      
    
    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
        host: ${{secrets.EC2_HOST}}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
            docker stop nanourl-backend || true
            docker rm nanourl-backend || true
          
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-sb:latest
          
            docker run -d \
              --name nanourl-backend \  
              -p 8080:8080 \
              -e "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
              -e "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" \
              -e "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" \
              -e "DATABASE_DIALECT=org.hibernate.dialect.PostgreSQLDialect" \
              -e "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              -e "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
              ${{ secrets.DOCKERHUB_USERNAME  }}/url-shortener-sb:latest
    

